version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: receiptiq_postgres
    environment:
      POSTGRES_USER: receiptiq
      POSTGRES_PASSWORD: password
      POSTGRES_DB: receiptiq
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U receiptiq"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: receiptiq_app
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://receiptiq:password@postgres:5432/receiptiq
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME}
      CLOUDFRONT_DOMAIN: ${CLOUDFRONT_DOMAIN}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
