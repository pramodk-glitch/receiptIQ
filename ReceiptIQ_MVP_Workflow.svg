<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="820" height="500" viewBox="0 0 820 500">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      text { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .title { font-size: 12px; font-weight: 600; }
      .sub   { font-size: 9.5px; }
      .zone  { font-size: 11px; font-weight: 600; }
      .label { font-size: 9px; fill: #5F5E5A; }
      .head  { font-size: 13px; font-weight: 600; fill: #2C2C2A; }
      .note  { font-size: 8.5px; font-style: italic; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="820" height="500" fill="#ffffff"/>

  <!-- Page title -->
  <text class="head" x="410" y="13" text-anchor="middle" dominant-baseline="central">ReceiptIQ MVP — Ingestion Workflow</text>

  <!-- ══════════════════════════════════════════
       Lane backgrounds
  ══════════════════════════════════════════ -->

  <!-- Lane 1: Manual Entry (neutral/green) -->
  <rect x="10" y="22" width="260" height="400" rx="10" fill="#F8F7F4" stroke="#B4B2A9" stroke-width="1"/>
  <text class="zone" x="140" y="38" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A">Manual Entry</text>

  <!-- Lane 2: Receipt Upload / AI OCR (purple/yellow) -->
  <rect x="280" y="22" width="260" height="400" rx="10" fill="#F5F3FE" stroke="#C4C0F5" stroke-width="1"/>
  <text class="zone" x="410" y="30" text-anchor="middle" dominant-baseline="central" fill="#7F77DD">Receipt Upload (AI OCR)</text>
  <text class="note" x="410" y="44" text-anchor="middle" dominant-baseline="central" fill="#EF9F27">requires Anthropic API key</text>

  <!-- Lane 3: Amazon CSV Import (orange/purple) -->
  <rect x="550" y="22" width="260" height="400" rx="10" fill="#FEF9F5" stroke="#F5C8B0" stroke-width="1"/>
  <text class="zone" x="680" y="38" text-anchor="middle" dominant-baseline="central" fill="#D85A30">Amazon CSV Import</text>

  <!-- ══════════════════════════════════════════
       Row 1 — Entry point boxes (y=45–89)
  ══════════════════════════════════════════ -->

  <!-- Lane 1: Manual Entry Form (neutral) -->
  <rect x="22" y="52" width="236" height="44" rx="7" fill="#F1EFE8" stroke="#888780" stroke-width="0.75"/>
  <text class="title" x="140" y="67" text-anchor="middle" dominant-baseline="central" fill="#2C2C2A">Manual Entry Form</text>
  <text class="sub"   x="140" y="83" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A">Store · Date · Line items · Categories</text>

  <!-- Lane 2: Upload Receipt Image (purple) -->
  <rect x="292" y="52" width="236" height="44" rx="7" fill="#EEEDFE" stroke="#7F77DD" stroke-width="0.75"/>
  <text class="title" x="410" y="67" text-anchor="middle" dominant-baseline="central" fill="#3C3489">Upload Receipt Image</text>
  <text class="sub"   x="410" y="83" text-anchor="middle" dominant-baseline="central" fill="#534AB7">Drag &amp; drop or file picker</text>

  <!-- Lane 3: Amazon Order History CSV (orange) -->
  <rect x="562" y="52" width="236" height="44" rx="7" fill="#FAECE7" stroke="#D85A30" stroke-width="0.75"/>
  <text class="title" x="680" y="67" text-anchor="middle" dominant-baseline="central" fill="#712B13">Amazon Order History CSV</text>
  <text class="sub"   x="680" y="83" text-anchor="middle" dominant-baseline="central" fill="#993C1D">Download from amazon.com</text>

  <!-- ══════════════════════════════════════════
       Arrows Row 1 → Row 2
  ══════════════════════════════════════════ -->
  <line x1="140" y1="96"  x2="140" y2="116" stroke="#B4B2A9" stroke-width="1" marker-end="url(#arr)"/>
  <line x1="410" y1="96"  x2="410" y2="116" stroke="#B4B2A9" stroke-width="1" marker-end="url(#arr)"/>
  <line x1="680" y1="96"  x2="680" y2="116" stroke="#B4B2A9" stroke-width="1" marker-end="url(#arr)"/>

  <!-- ══════════════════════════════════════════
       Row 2 — Processing (y=118–165)
  ══════════════════════════════════════════ -->

  <!-- Lane 1: Validate & POST (neutral) -->
  <rect x="22" y="118" width="236" height="44" rx="7" fill="#F1EFE8" stroke="#888780" stroke-width="0.75"/>
  <text class="title" x="140" y="134" text-anchor="middle" dominant-baseline="central" fill="#2C2C2A">Validate &amp; POST /api/receipts</text>
  <text class="sub"   x="140" y="150" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A">Client-side + server validation</text>

  <!-- Lane 2: Presigned URL → Upload to S3 (purple) -->
  <rect x="292" y="118" width="236" height="44" rx="7" fill="#EEEDFE" stroke="#7F77DD" stroke-width="0.75"/>
  <text class="title" x="410" y="134" text-anchor="middle" dominant-baseline="central" fill="#3C3489">Presigned URL → Upload to S3</text>
  <text class="sub"   x="410" y="150" text-anchor="middle" dominant-baseline="central" fill="#534AB7">Direct browser-to-S3 upload</text>

  <!-- Lane 3: Parse CSV (orange) -->
  <rect x="562" y="118" width="236" height="44" rx="7" fill="#FAECE7" stroke="#D85A30" stroke-width="0.75"/>
  <text class="title" x="680" y="134" text-anchor="middle" dominant-baseline="central" fill="#712B13">Parse CSV</text>
  <text class="sub"   x="680" y="150" text-anchor="middle" dominant-baseline="central" fill="#993C1D">Deduplicate by Order ID</text>

  <!-- Arrow Lane 2 Row 2 → OCR box -->
  <line x1="410" y1="162" x2="410" y2="178" stroke="#B4B2A9" stroke-width="1" marker-end="url(#arr)"/>

  <!-- Lane 2: Lambda → Claude Vision OCR (yellow) -->
  <rect x="292" y="180" width="236" height="54" rx="7" fill="#FAEEDA" stroke="#EF9F27" stroke-width="0.75"/>
  <text class="title" x="410" y="197" text-anchor="middle" dominant-baseline="central" fill="#633806">Lambda → Claude Vision OCR</text>
  <text class="sub"   x="410" y="213" text-anchor="middle" dominant-baseline="central" fill="#854F0B">Extract line items · categories</text>
  <text class="note" x="410" y="227" text-anchor="middle" dominant-baseline="central" fill="#EF9F27">(requires Anthropic API key)</text>

  <!-- ══════════════════════════════════════════
       Arrows Row 2/OCR → Row 3
  ══════════════════════════════════════════ -->
  <line x1="140" y1="162" x2="140" y2="248" stroke="#B4B2A9" stroke-width="1" marker-end="url(#arr)"/>
  <line x1="410" y1="234" x2="410" y2="248" stroke="#B4B2A9" stroke-width="1" marker-end="url(#arr)"/>
  <line x1="680" y1="162" x2="680" y2="248" stroke="#B4B2A9" stroke-width="1" marker-end="url(#arr)"/>

  <!-- ══════════════════════════════════════════
       Row 3 — Stored in PostgreSQL (y=250–290)
  ══════════════════════════════════════════ -->

  <!-- Lane 1 stored -->
  <rect x="22" y="250" width="236" height="40" rx="7" fill="#E1F5EE" stroke="#1D9E75" stroke-width="0.75"/>
  <text class="title" x="140" y="270" text-anchor="middle" dominant-baseline="central" fill="#085041">Receipt stored in PostgreSQL</text>

  <!-- Lane 2 stored -->
  <rect x="292" y="250" width="236" height="40" rx="7" fill="#E1F5EE" stroke="#1D9E75" stroke-width="0.75"/>
  <text class="title" x="410" y="270" text-anchor="middle" dominant-baseline="central" fill="#085041">Receipt stored in PostgreSQL</text>

  <!-- Lane 3 stored -->
  <rect x="562" y="250" width="236" height="40" rx="7" fill="#E1F5EE" stroke="#1D9E75" stroke-width="0.75"/>
  <text class="title" x="680" y="270" text-anchor="middle" dominant-baseline="central" fill="#085041">Receipt stored in PostgreSQL</text>

  <!-- ══════════════════════════════════════════
       Converge arrows → Receipt in Database
  ══════════════════════════════════════════ -->
  <line x1="140" y1="290" x2="320" y2="308" stroke="#B4B2A9" stroke-width="1" marker-end="url(#arr)"/>
  <line x1="410" y1="290" x2="410" y2="308" stroke="#B4B2A9" stroke-width="1" marker-end="url(#arr)"/>
  <line x1="680" y1="290" x2="500" y2="308" stroke="#B4B2A9" stroke-width="1" marker-end="url(#arr)"/>

  <!-- ══════════════════════════════════════════
       Receipt in Database (wide green box)
  ══════════════════════════════════════════ -->
  <rect x="160" y="310" width="500" height="40" rx="8" fill="#E1F5EE" stroke="#1D9E75" stroke-width="1"/>
  <text class="title" x="410" y="323" text-anchor="middle" dominant-baseline="central" fill="#085041">Receipt in Database</text>
  <text class="sub"   x="410" y="339" text-anchor="middle" dominant-baseline="central" fill="#0F6E56">Users · Receipts · ReceiptItem · PriceHistory</text>

  <!-- ══════════════════════════════════════════
       Fan out to Analytics outputs
  ══════════════════════════════════════════ -->
  <line x1="260" y1="350" x2="180" y2="368" stroke="#B4B2A9" stroke-width="1" marker-end="url(#arr)"/>
  <line x1="410" y1="350" x2="410" y2="368" stroke="#B4B2A9" stroke-width="1" marker-end="url(#arr)"/>
  <line x1="560" y1="350" x2="640" y2="368" stroke="#B4B2A9" stroke-width="1" marker-end="url(#arr)"/>

  <!-- ══════════════════════════════════════════
       Analytics outputs (y=370–440)
  ══════════════════════════════════════════ -->

  <!-- Dashboard -->
  <rect x="60" y="370" width="240" height="52" rx="7" fill="#E1F5EE" stroke="#1D9E75" stroke-width="0.75"/>
  <text class="title" x="180" y="388" text-anchor="middle" dominant-baseline="central" fill="#085041">Dashboard</text>
  <text class="sub"   x="180" y="405" text-anchor="middle" dominant-baseline="central" fill="#0F6E56">This month · Count · Top category</text>

  <!-- Analytics Charts -->
  <rect x="290" y="370" width="240" height="52" rx="7" fill="#E1F5EE" stroke="#1D9E75" stroke-width="0.75"/>
  <text class="title" x="410" y="388" text-anchor="middle" dominant-baseline="central" fill="#085041">Analytics Charts</text>
  <text class="sub"   x="410" y="405" text-anchor="middle" dominant-baseline="central" fill="#0F6E56">Monthly spending · Category pie</text>

  <!-- Receipt Detail -->
  <rect x="520" y="370" width="240" height="52" rx="7" fill="#E1F5EE" stroke="#1D9E75" stroke-width="0.75"/>
  <text class="title" x="640" y="388" text-anchor="middle" dominant-baseline="central" fill="#085041">Receipt Detail</text>
  <text class="sub"   x="640" y="405" text-anchor="middle" dominant-baseline="central" fill="#0F6E56">Line items · Store · Date · Delete</text>

  <!-- ══════════════════════════════════════════
       Legend
  ══════════════════════════════════════════ -->
  <rect x="10" y="430" width="360" height="60" rx="8" fill="#F8F8F6" stroke="#E5E3DC" stroke-width="0.75"/>
  <text class="label" x="22" y="445" dominant-baseline="central" font-weight="600">Legend</text>
  <rect x="22" y="454" width="12" height="12" rx="2" fill="#F1EFE8" stroke="#888780" stroke-width="0.75"/>
  <text class="label" x="40" y="460" dominant-baseline="central">Manual entry / neutral path</text>
  <rect x="130" y="454" width="12" height="12" rx="2" fill="#EEEDFE" stroke="#7F77DD" stroke-width="0.75"/>
  <text class="label" x="148" y="460" dominant-baseline="central">AI / application processing</text>
  <rect x="22" y="472" width="12" height="12" rx="2" fill="#FAEEDA" stroke="#EF9F27" stroke-width="0.75"/>
  <text class="label" x="40" y="478" dominant-baseline="central">Lambda / OCR (needs API key)</text>
  <rect x="130" y="472" width="12" height="12" rx="2" fill="#FAECE7" stroke="#D85A30" stroke-width="0.75"/>
  <text class="label" x="148" y="478" dominant-baseline="central">User-facing / Amazon import</text>
  <rect x="248" y="454" width="12" height="12" rx="2" fill="#E1F5EE" stroke="#1D9E75" stroke-width="0.75"/>
  <text class="label" x="266" y="460" dominant-baseline="central">Storage &amp; analytics outputs</text>
</svg>
